openapi: 3.0.3
info:
  title: Area Backend API
  version: 1.0.0
  description: |-
    HTTP API exposed by the Area backend. All routes are mounted under `CONFIG.BASE_PATH`
    (default `/api`). Authentication uses bearer JWTs issued by `/auth/login`. Runner
    endpoints use a shared nonce/token pair carried in custom headers.
servers:
  - url: /api
tags:
  - name: Health
    description: Lightweight health probes
  - name: Auth
    description: Authentication and password management
  - name: Workflows
    description: Workflow lifecycle endpoints
  - name: Runner
    description: Module runner integration hooks
  - name: Modules
    description: Module catalog management
  - name: Users
    description: User and profile management
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by `/auth/login`
    RunnerJobId:
      type: apiKey
      in: header
      name: X-Runner-Job
      description: Runner job identifier returned when the workflow execution was created
    RunnerToken:
      type: apiKey
      in: header
      name: X-Runner-Token
      description: HMAC token used to authenticate runner -> backend callbacks
    PasswordResetToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token sent with password reset emails ("Bearer <token>")
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human readable error message
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          example: "42"
        email:
          type: string
          format: email
        username:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserLookup:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
    UserUpdateRequest:
      type: object
      description: Provide at least one field
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        permissions:
          type: integer
          description: Bitmask, admin-only
        profilePicture:
          type: string
          format: byte
          nullable: true
          description: Base64 encoded PNG data, or null to clear the picture
    UserCreateRequest:
      type: object
      required:
        - email
        - username
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
          description: Required unless email verification is enabled
    UserCreatedResponse:
      type: object
      required:
        - id
        - email
        - username
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
    UserCredential:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
    UserWorkflowSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
    TeamSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    Workflow:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: integer
        enabled:
          type: boolean
        definition:
          type: object
          description: Workflow definition payload
      additionalProperties: true
    WorkflowListResponse:
      type: object
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'
    SetPasswordRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
        context:
          type: string
          enum:
            - reset
            - initialization
          description: Optional context carried by the token
    RegisterRequest:
      type: object
      required:
        - email
        - username
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
          description: Required when email verification is disabled
    LoginRequest:
      type: object
      required:
        - password
      anyOf:
        - required:
            - email
        - required:
            - username
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer token
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
              format: email
            displayName:
              type: string
    RunnerWorkflowResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/Workflow'
        version:
          type: integer
        credentialIds:
          type: array
          items:
            type: string
        modulesUrl:
          type: string
    RunnerCredentialsRequest:
      type: object
      properties:
        credentialIds:
          type: array
          items:
            type: string
    RunnerCredentialPayload:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        data:
          type: object
          additionalProperties: true
    RunnerCredentialsResponse:
      type: object
      properties:
        credentials:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RunnerCredentialPayload'
    RunnerCallbackRequest:
      type: object
      required:
        - status
      properties:
        jobId:
          type: string
        status:
          type: string
          enum:
            - running
            - succeeded
            - failed
        result:
          description: Arbitrary runner payload/result
        errorMessage:
          type: string
    ModulesReloadResponse:
      type: object
      properties:
        message:
          type: string
          example: Modules reloaded.
    ModulesResponse:
      type: object
      properties:
        modules:
          type: object
          additionalProperties: true
    ModulesManifestResponse:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Liveness probe
      responses:
        '200':
          description: Service is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                example:
                  status: ok
  /auth/reset_password:
    get:
      tags:
        - Auth
      summary: Send password reset email for the caller
      responses:
        '200':
          description: Reset email queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Missing or invalid token
        '404':
          description: Email sending disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/{id}/reset_password:
    get:
      tags:
        - Auth
      summary: Send a password reset email for a specific user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reset email queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing ID
        '401':
          description: Missing/invalid token
        '403':
          description: Caller is not an admin
        '404':
          description: Email sending disabled
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/set_password:
    post:
      tags:
        - Auth
      summary: Set or initialize a password using a reset token
      security:
        - PasswordResetToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
        '201':
          description: Password initialized for a brand new account
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
        '401':
          description: Token missing/invalid/expired
        '409':
          description: User already exists during initialization
        '500':
          description: Internal error
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Verification email dispatched (email-check mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '201':
          description: User created immediately
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreatedResponse'
        '400':
          description: Missing fields
        '409':
          description: Email or username already exists
        '500':
          description: Internal error
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in using username or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing credentials
        '401':
          description: Invalid credentials
        '500':
          description: Internal error
  /auth/supports_check_email:
    get:
      tags:
        - Auth
      summary: Discover whether email verification is enabled
      responses:
        '200':
          description: Email verification enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Email verification disabled
        '500':
          description: Internal error
  /workflows:
    get:
      tags:
        - Workflows
      summary: List all workflows
      responses:
        '200':
          description: Workflow list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
    post:
      tags:
        - Workflows
      summary: Create or update a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workflow'
      responses:
        '201':
          description: Workflow stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          description: Invalid workflow payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workflows/{id}:
    get:
      tags:
        - Workflows
      summary: Load a workflow
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /workflows/{id}/enable:
    post:
      tags:
        - Workflows
      summary: Enable a workflow
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '404':
          description: Workflow not found
  /workflows/{id}/disable:
    post:
      tags:
        - Workflows
      summary: Disable a workflow
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '404':
          description: Workflow not found
  /modules/reload:
    get:
      tags:
        - Modules
      summary: Reload the module catalog
      responses:
        '200':
          description: Reload completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModulesReloadResponse'
  /runner/workflows/{id}:
    get:
      tags:
        - Runner
      summary: Fetch workflow metadata for a runner job
      security:
        - RunnerJobId: []
          RunnerToken: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow provided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerWorkflowResponse'
        '403':
          description: Auth mismatch / job-workflow mismatch
        '404':
          description: Workflow or job not found
        '500':
          description: Internal error
  /runner/credentials:
    post:
      tags:
        - Runner
      summary: Resolve workflow credential payloads for a job
      security:
        - RunnerJobId: []
          RunnerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerCredentialsRequest'
      responses:
        '200':
          description: Credential payloads returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunnerCredentialsResponse'
        '403':
          description: Invalid token
  /runner/modules:
    get:
      tags:
        - Runner
      summary: Retrieve the module catalog (unauthenticated)
      responses:
        '200':
          description: Module catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModulesResponse'
  /runner/modules/manifest:
    get:
      tags:
        - Runner
      summary: List module files available to the runner
      security:
        - RunnerJobId: []
          RunnerToken: []
      responses:
        '200':
          description: Module manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModulesManifestResponse'
  /runner/modules/files/{filePath}:
    get:
      tags:
        - Runner
      summary: Download a module file
      description: Serves compiled (dist) or source module assets. `filePath` may contain slashes.
      security:
        - RunnerJobId: []
          RunnerToken: []
      parameters:
        - in: path
          name: filePath
          required: true
          schema:
            type: string
          description: Relative path inside the modules directory
      responses:
        '200':
          description: File contents
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found
  /runner/callback:
    post:
      tags:
        - Runner
      summary: Runner -> backend status callback
      security:
        - RunnerJobId: []
          RunnerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunnerCallbackRequest'
      responses:
        '200':
          description: Callback recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '400':
          description: Invalid payload
        '403':
          description: Invalid token
  /users:
    post:
      tags:
        - Users
      summary: Create a user (admin)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '200':
          description: Verification mail sent (email-check mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreatedResponse'
        '400':
          description: Validation error
        '409':
          description: Username or email already taken
        '500':
          description: Internal error
  /users/me:
    get:
      tags:
        - Users
      summary: Retrieve the authenticated user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Users
      summary: Update the authenticated user's profile
      description: Admin users may also change their permissions via this route.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid payload
        '403':
          description: Attempted to edit forbidden fields
        '404':
          description: User not found
        '500':
          description: Internal error
    delete:
      tags:
        - Users
      summary: Delete the caller's account
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: User not found
  /users/{id}:
    get:
      tags:
        - Users
      summary: Retrieve a user by id (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Missing id
        '404':
          description: Not found
    put:
      tags:
        - Users
      summary: Update a user by id (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid payload
        '403':
          description: Forbidden (non-admin)
        '404':
          description: User not found
    delete:
      tags:
        - Users
      summary: Delete a user by id (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing id
        '404':
          description: User not found
  /users/email/{email}:
    get:
      tags:
        - Users
      summary: Lookup a user profile by email
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: Minimal user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLookup'
        '400':
          description: Missing email
        '404':
          description: Not found
  /users/username/{username}:
    get:
      tags:
        - Users
      summary: Lookup a user profile by username
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Minimal user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLookup'
        '400':
          description: Missing username
        '404':
          description: Not found
  /users/me/image:
    get:
      tags:
        - Users
      summary: Download the caller's profile picture
      security:
        - bearerAuth: []
      responses:
        '200':
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Picture not set
  /users/{id}/image:
    get:
      tags:
        - Users
      summary: Download a user's profile picture (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Missing id
        '404':
          description: Picture or user not found
  /users/email/{email}/image:
    get:
      tags:
        - Users
      summary: Download a profile picture by email
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: email
          required: true
          schema:
            type: string
            format: email
      responses:
        '200':
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Missing email
        '404':
          description: User or picture not found
  /users/username/{username}/image:
    get:
      tags:
        - Users
      summary: Download a profile picture by username
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: username
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PNG image
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Missing username
        '404':
          description: User or picture not found
  /users/me/workflows:
    get:
      tags:
        - Users
      summary: List workflows the caller belongs to
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workflow summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWorkflowSummary'
        '500':
          description: Internal error
  /users/{id}/workflows:
    get:
      tags:
        - Users
      summary: List workflows for a user (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWorkflowSummary'
        '400':
          description: Missing id
  /users/me/credentials:
    get:
      tags:
        - Users
      summary: List credentials owned by the caller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Credential list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCredential'
  /users/{id}/credentials:
    get:
      tags:
        - Users
      summary: List credentials for a user (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCredential'
        '400':
          description: Missing id
  /users/me/teams:
    get:
      tags:
        - Users
      summary: List teams the caller belongs to
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Team list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamSummary'
  /users/{id}/teams:
    get:
      tags:
        - Users
      summary: List teams for a user (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Team list
          content:
            application/json:
              schema:
                type: array
                items:
