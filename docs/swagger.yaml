openapi: 3.0.3
info:
  title: Area Backend API
  version: 1.0.0
  description: |-
    HTTP API exposed by the Area backend. All routes are mounted under `CONFIG.BASE_PATH`
    (default `/api`). Authentication uses bearer JWTs issued by `/auth/login`. Runner
    endpoints use a shared nonce/token pair carried in custom headers.
servers:
  - url: /api
tags:
  - name: Health
    description: Lightweight health probes
  - name: Auth
    description: Authentication and password management
  - name: Credentials
    description: Credential storage and sharing
  - name: Workflows
    description: Workflow lifecycle endpoints
  - name: Runner
    description: Module runner integration hooks
  - name: Modules
    description: Module catalog management
  - name: Teams
    description: Team management endpoints
  - name: Users
    description: User and profile management
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by `/auth/login`
    RunnerJobId:
      type: apiKey
      in: header
      name: X-Runner-Job
      description: Runner job identifier returned when the workflow execution was created
    RunnerToken:
      type: apiKey
      in: header
      name: X-Runner-Token
      description: HMAC token used to authenticate runner -> backend callbacks
    PasswordResetToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token sent with password reset emails ("Bearer <token>")
  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Human readable error message
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
          example: "42"
        email:
          type: string
          format: email
        username:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UserLookup:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
    UserUpdateRequest:
      type: object
      description: Provide at least one field
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        permissions:
          type: integer
          description: Bitmask, admin-only
        profilePicture:
          type: string
          format: byte
          nullable: true
          description: Base64 encoded PNG data, or null to clear the picture
    UserImageUploadRequest:
      type: object
      required:
        - image
      properties:
        image:
          type: string
          format: byte
          description: Base64 encoded PNG data; data URI prefixes are accepted
    UserCreateRequest:
      type: object
      required:
        - email
        - username
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
          description: Required unless email verification is enabled
    UserCreatedResponse:
      type: object
      required:
        - id
        - email
        - username
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
    UserCredential:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
    CredentialRecord:
      type: object
      required:
        - id
        - type
        - data
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        version:
          type: string
        description:
          type: string
          nullable: true
        data:
          type: object
          additionalProperties: true
          description: Field names only; values are redacted placeholders ("***")
    CredentialSaveRequest:
      type: object
      required:
        - id
        - type
        - data
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        version:
          type: string
        description:
          type: string
          nullable: true
        data:
          type: object
          additionalProperties: true
          description: Full credential payload to store (actual secret values)
    UserWorkflowSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        enabled:
          type: boolean
    TeamSummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    TeamListResponse:
      type: object
      properties:
        teams:
          type: array
          items:
            $ref: '#/components/schemas/TeamSummary'
    TeamResponse:
      type: object
      properties:
        team:
          $ref: '#/components/schemas/TeamSummary'
    TeamSaveRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Team name
    UserLinkRequest:
      type: object
      required:
        - userId
      properties:
        userId:
          type: string
          description: User identifier
    TeamLinkRequest:
      type: object
      required:
        - teamId
      properties:
        teamId:
          type: string
          description: Team identifier
    Workflow:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: integer
        enabled:
          type: boolean
        definition:
          type: object
          description: Workflow definition payload
        data:
          type: object
          additionalProperties: true
          description: Arbitrary workflow metadata payload
      additionalProperties: true
    WorkflowListResponse:
      type: object
      properties:
        workflows:
          type: array
          items:
            $ref: '#/components/schemas/Workflow'
    SetPasswordRequest:
      type: object
      required:
        - password
      properties:
        password:
          type: string
        context:
          type: string
          enum:
            - reset
            - initialization
          description: Optional context carried by the token
    RegisterRequest:
      type: object
      required:
        - email
        - username
      properties:
        email:
          type: string
          format: email
        username:
          type: string
        password:
          type: string
          description: Required when email verification is disabled
    LoginRequest:
      type: object
      required:
        - password
        - user
      properties:
        user:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer token
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
              format: email
            displayName:
              type: string
    RunnerWorkflowResponse:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/Workflow'
        version:
          type: integer
        credentialIds:
          type: array
          items:
            type: string
        modulesUrl:
          type: string
    RunnerCredentialsRequest:
      type: object
      properties:
        credentialIds:
          type: array
          items:
            type: string
    RunnerCredentialPayload:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        name:
          type: string
        data:
          type: object
          additionalProperties: true
    RunnerCredentialsResponse:
      type: object
      properties:
        credentials:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RunnerCredentialPayload'
    RunnerCallbackRequest:
      type: object
      required:
        - status
      properties:
        jobId:
          type: string
        status:
          type: string
          enum:
            - running
            - succeeded
            - failed
        result:
          description: Arbitrary runner payload/result
        errorMessage:
          type: string
    ModulesReloadResponse:
      type: object
      properties:
        message:
          type: string
          example: Modules reloaded.
    ModulesResponse:
      type: object
      properties:
        modules:
          type: object
          additionalProperties: true
    ModulesManifestResponse:
      type: object
      properties:
        files:
          type: array
          items:
            type: string
    ResetPasswordRequestBody:
      type: object
      properties:
        email:
          type: string
          format: email
        username:
          type: string
paths:
  /healthz:
    get:
      tags:
        - Health
      summary: Liveness probe
      responses:
        '200':
          description: Service is reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                example:
                  status: ok
  /auth/reset_password:
    post:
      tags:
        - Auth
      summary: Send password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequestBody'
      responses:
        '200':
          description: Reset email queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Email sending disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/{id}/reset_password:
    get:
      tags:
        - Auth
      summary: Send a password reset email for a specific user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Reset email queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Missing ID
        '401':
          description: Missing/invalid token
        '403':
          description: Caller is not an admin
        '404':
          description: Email sending disabled
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/set_password:
    post:
      tags:
        - Auth
      summary: Set or initialize a password using a reset token
      security:
        - PasswordResetToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPasswordRequest'
      responses:
        '200':
          description: Password updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
        '201':
          description: Password initialized for a brand new account
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: string
        '401':
          description: Token missing/invalid/expired
        '409':
          description: User already exists during initialization
        '500':
          description: Internal error
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Verification email dispatched (email-check mode)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '201':
          description: User created immediately
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreatedResponse'
        '400':
          description: Missing fields
        '409':
          description: Email or username already exists
        '500':
          description: Internal error
  /auth/login:
    post:
      tags:
        - Auth
      summary: Log in using username or email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing credentials
        '401':
          description: Invalid credentials
        '500':
          description: Internal error
  /auth/supports_check_email:
    get:
      tags:
        - Auth
      summary: Discover whether email verification is enabled
      responses:
        '200':
          description: Email verification enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Email verification disabled
        '500':
          description: Internal error
  /credentials/public:
    get:
      tags:
        - Credentials
      summary: List credentials with no ownership restrictions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Public credential list
          content:
            application/json:
              schema:
                type: object
                properties:
                  credentials:
                    type: array
                    items:
                      $ref: '#/components/schemas/CredentialRecord'
        '401':
          description: Missing or invalid token
        '404':
          description: No credentials available
        '500':
          description: Internal error
  /credentials:
    get:
      tags:
        - Credentials
      summary: List credentials owned by the caller
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Credential list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCredential'
        '404':
          description: Not found
        '500':
          description: Internal error
    post:
      tags:
        - Credentials
      summary: Create or update a credential definition
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialSaveRequest'
      responses:
        '201':
          description: Credential persisted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '400':
          description: Missing fields or invalid payload
        '401':
          description: Missing or invalid token
        '500':
          description: Internal error
  /credentials/all:
    get:
      tags:
        - Credentials
      summary: List all credentials (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Credential list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCredential'
        '404':
          description: Not found
        '500':
          description: Internal error
  /credentials/{id}:
    get:
      tags:
        - Credentials
      summary: Retrieve a credential by id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not allowed to use the credential
        '404':
          description: Credential not found
        '500':
          description: Internal error
    put:
      tags:
        - Credentials
      summary: Update an existing credential definition
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialSaveRequest'
      responses:
        '200':
          description: Credential updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '400':
          description: Invalid request or payload
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not credential owner or admin
        '404':
          description: Credential not found
        '500':
          description: Internal error
    delete:
      tags:
        - Credentials
      summary: Delete a credential definition
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Credential removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not credential owner or admin
        '404':
          description: Credential not found
        '500':
          description: Internal error
  /credentials/{id}/users:
    post:
      tags:
        - Credentials
      summary: Grant a user access to a credential
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLinkRequest'
      responses:
        '200':
          description: Updated credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not an owner or admin
        '404':
          description: Credential or user not found
  /credentials/{id}/users/{userId}:
    delete:
      tags:
        - Credentials
      summary: Revoke a user's access to a credential
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not an owner or admin
        '404':
          description: Credential not found
  /credentials/{id}/owners:
    post:
      tags:
        - Credentials
      summary: Promote or add a credential owner
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLinkRequest'
      responses:
        '200':
          description: Updated credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not an owner or admin
        '404':
          description: Credential or user not found
  /credentials/{id}/owners/{userId}:
    delete:
      tags:
        - Credentials
      summary: Remove an owner from a credential
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not an owner or admin
        '404':
          description: Credential not found
  /credentials/{id}/user-teams:
    post:
      tags:
        - Credentials
      summary: Grant a team user-level access to a credential
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamLinkRequest'
      responses:
        '200':
          description: Updated credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not an owner or admin
        '404':
          description: Credential or team not found
  /credentials/{id}/user-teams/{teamId}:
    delete:
      tags:
        - Credentials
      summary: Revoke a team's user-level access to a credential
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not an owner or admin
        '404':
          description: Credential not found
  /credentials/{id}/owner-teams:
    post:
      tags:
        - Credentials
      summary: Grant a team owner-level access to a credential (promotes if necessary)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamLinkRequest'
      responses:
        '200':
          description: Updated credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not an owner or admin
        '404':
          description: Credential or team not found
  /credentials/{id}/owner-teams/{teamId}:
    delete:
      tags:
        - Credentials
      summary: Revoke a team's owner-level access to a credential
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: teamId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Updated credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialRecord'
        '400':
          description: Invalid request
        '401':
          description: Missing or invalid token
        '403':
          description: Caller is not an owner or admin
        '404':
          description: Credential not found
  /workflows/public:
    get:
      tags:
        - Workflows
      security:
        - bearerAuth: []
      summary: List all public workflows
      responses:
        '200':
          description: Workflow list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowListResponse'
        '404':
          description: No public workflows found
        '500':
          description: Internal error
  /workflows:
    get:
      tags:
        - Workflows
      summary: List workflows the caller belongs to
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workflow summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWorkflowSummary'
        '404':
          description: Not found
        '500':
          description: Internal error
    post:
      tags:
        - Workflows
      security:
        - bearerAuth: []
      summary: Create or update a workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Workflow'
      responses:
        '201':
          description: Workflow stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          description: Invalid workflow payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal error
  /workflows/all:
    get:
      tags:
        - Workflows
      summary: List all workflows (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Workflow summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserWorkflowSummary'
        '404':
          description: Not found
        '500':
          description: Internal error
  /workflows/{id}:
    get:
      tags:
        - Workflows
      security:
        - bearerAuth: []
      summary: Load a workflow
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Workflow found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '404':
          description: Workflow not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      tags:
        - Workflows
